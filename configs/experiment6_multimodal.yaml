name: experiment6_multimodal
environment: multimodal
question: Does sequential design visit and reconstruct three distinct mechanisms, or lock onto one region?
algorithms:
  - random
  - uncertainty
  - diversity
  - echo_v0
n_candidates: 2000
budget: 20
n_init: 3
noise: 0.1
n_test: 400
n_probe: 64
domain_low: -2.0
domain_high: 2.0
n_seeds: 30
seed_start: 0
output_dir: results
n_restarts: 1
cost_mode: uniform
primary_algorithm: echo_v0
comparator: uncertainty
failure_metric: mean_region_rmse
failure_higher_is_better: false
plot_metrics:
  - mean_region_rmse
  - region_coverage
  - function_recovery_rmse
