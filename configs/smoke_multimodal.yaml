name: smoke_multimodal
environment: multimodal
algorithms:
  - random
  - uncertainty
  - echo_v0
n_candidates: 80
budget: 6
n_init: 2
noise: 0.1
n_test: 40
n_probe: 16
domain_low: -2.0
domain_high: 2.0
n_seeds: 2
seed_start: 0
output_dir: results
n_restarts: 0
cost_mode: uniform
primary_algorithm: echo_v0
comparator: uncertainty
failure_metric: mean_region_rmse
failure_higher_is_better: false
plot_metrics:
  - mean_region_rmse
  - region_coverage
